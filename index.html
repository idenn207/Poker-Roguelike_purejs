<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Poker Roguelike</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/animations.css">
</head>

<body>
  <!-- 로딩 화면 (로고) -->
  <div class="screen" id="logoScreen">
    <div class="logo-container">
      <div class="logo">로고</div>
    </div>
  </div>

  <!-- 로딩 화면 (로딩) -->
  <div class="screen" id="loadingScreen">
    <div class="loading-text">Loading...</div>
  </div>

  <!-- 메인 메뉴 -->
  <div class="screen" id="menuScreen">
    <div class="menu-container">
      <h1 class="game-title">제 목</h1>
      <div class="menu-buttons">
        <button class="menu-btn" onclick="gameManager.newGame()">처음부터</button>
        <button class="menu-btn" onclick="gameManager.showDevelopingMessage()">이어하기</button>
        <button class="menu-btn" onclick="gameManager.showDevelopingMessage()">카드목록</button>
        <button class="menu-btn" onclick="gameManager.showDevelopingMessage()">설정</button>
      </div>
    </div>
  </div>

  <!-- 스테이지 선택 화면 -->
  <div class="screen" id="stageSelectScreen">
    <div class="stage-header">
      <div class="stage-progress">2 번째 등정방향</div>
    </div>
    <div class="stage-content">
      <div class="entity-box player-entity">
        <div class="entity-label">플레이어</div>
        <div class="entity-subtext">엔티티(이미지)</div>
      </div>

      <div class="path-indicator">1. 선택시 바로 이동</div>

      <div class="entity-box monster-entity">
        <div class="entity-label">몬스터</div>
        <div class="entity-subtext">엔티티(이미지)</div>
      </div>
    </div>
    <div class="stage-footer">
      <div class="stage-options">
        <div class="stage-option elite" onclick="gameManager.selectStage('elite')">
          <div class="option-label">엘리트</div>
        </div>
        <div class="stage-option monster hoverable" onclick="gameManager.selectStage('monster')">
          <div class="option-label">플레이 테이블</div>
          <div class="option-hover">(hover)<br>몬스터</div>
        </div>
        <div class="stage-option shop" onclick="gameManager.selectStage('shop')">
          <div class="option-label">상점</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 전투 화면 -->
  <div class="screen" id="battleScreen">
    <div class="battle-header">
      <div class="hp-bar player-hp">
        <span>체력 (100/100)</span>
        <div class="hp-fill" style="width: 100%"></div>
      </div>
      <div class="item-slots">
        <div class="item-slot active">아이템</div>
        <div class="item-slot"></div>
        <div class="item-slot"></div>
      </div>
      <div class="battle-info">
        <div class="stage-label">스테이지 (1-2)</div>
        <div class="coin-counter">코인<br>250</div>
      </div>
      <div class="menu-icons">
        <button class="icon-btn">⚙️</button>
        <button class="icon-btn">📊</button>
        <button class="icon-btn">🔆</button>
        <button class="icon-btn">⚙️</button>
      </div>
    </div>

    <div class="battle-content">
      <div class="entities">
        <div class="entity-card player-entity">
          <div class="entity-name">플레이어</div>
        </div>

        <div class="monsters-container">
          <!-- 몬스터들이 동적으로 생성됨 -->
        </div>
      </div>

      <div class="play-area">
        <!-- 몬스터 핸드 영역 추가 -->
        <div class="monster-hand-area">
          <span class="hand-label">몬스터 핸드</span>
          <div class="monster-hand-cards">
            <!-- 몬스터 카드들 -->
          </div>
        </div>

        <div class="player-hand-area">
          <div class="hand-controls">
            <span class="hand-label">플레이어 핸드</span>
            <button class="sort-btn" onclick="gameManager.sortPlayerHand()">정렬</button>
          </div>
          <div class="hand-preview"></div>
          <div class="player-hand-cards">
            <!-- 손패 카드들이 동적으로 생성됨 -->
          </div>
          <div class="play-controls">
            <button class="action-btn play" onclick="gameManager.playHand()">플레이</button>
            <button class="action-btn discard-btn" onclick="gameManager.discardCards()">버리기 (3)</button>
          </div>
        </div>
      </div>
    </div>

    <div class="effect-preview">
      <span>적 예상 플레이(족보) (ex: 플러쉬)</span>
    </div>
  </div>

  <!-- 보상 화면 -->
  <div class="screen" id="rewardScreen">
    <div class="reward-header">
      <div class="hp-bar player-hp">
        <span>체력 (68/100)</span>
        <div class="hp-fill" style="width: 68%"></div>
      </div>
      <div class="battle-info">
        <div class="stage-label">스테이지 (1-2)</div>
        <div class="coin-counter">코인<br>400</div>
      </div>
      <div class="menu-icons">
        <button class="icon-btn">⚙️</button>
      </div>
    </div>

    <div class="reward-content">
      <div class="entity-box player-entity">
        <div class="entity-label">플레이어<br>엔티티(이미지)</div>
      </div>

      <div class="reward-message">
        하나만 선택 가능(선택시 바로 맵선택 화면 전환)
      </div>

      <div class="reward-options">
        <div class="reward-option coin-reward" onclick="gameManager.selectReward('coin')">
          <div class="reward-value">+50</div>
          <div class="reward-label">코인</div>
        </div>

        <div class="reward-option card-reward" onclick="gameManager.selectReward('card')">
          <div class="card-display">♠2</div>
          <div class="reward-label">능력카드</div>
        </div>

        <div class="reward-option relic-reward" onclick="gameManager.selectReward('relic')">
          <div class="reward-label">유물</div>
        </div>

        <button class="skip-btn" onclick="gameManager.skipReward()">스킵</button>
      </div>
    </div>
  </div>

  <!-- 스크립트 로드 -->
  <!-- <script src="src/utils/random.js"></script>
  <script src="src/models/card.js"></script>
  <script src="src/models/deck.js"></script>
  <script src="src/models/hand.js"></script>
  <script src="src/models/poker-evaluaor.js"></script>
  <script src="src/models/combat-system.js"></script>
  <script src="src/managers/game-manager.js"></script>
  <script src="src/managers/screen-manager.js"></script>
  <script src="src/managers/card-renderer.js"></script>
  <script src="src/main.js"></script> -->
  <script src="src/core/GameLoop.js"></script>
</body>

</html>
